version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # vitest and its plugins must move together (their peer ranges are pinned to the same major)
      vitest:
        patterns: [vitest, '@vitest/*']
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 (native compiler) isn't supported by typescript-eslint yet; revisit when it is.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
